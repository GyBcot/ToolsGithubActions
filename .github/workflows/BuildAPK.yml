name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag source zip (kosongkan untuk ambil terbaru)'
        required: false
        default: ''

permissions:
  actions: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get Release Info
        id: release
        run: |
          INPUT_TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$INPUT_TAG" ]; then
            RELEASE_JSON=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest")
          else
            RELEASE_JSON=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/${INPUT_TAG}")
          fi
          TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
          ASSET_ID=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | endswith(".zip")) | .id' | head -1)
          ZIP_NAME=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | endswith(".zip")) | .name' | head -1)
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT
          echo "asset_id=$ASSET_ID" >> $GITHUB_OUTPUT
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT

      - name: Download Source ZIP from Release
        run: |
          mkdir -p source
          curl -L \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            -o "source/${{ steps.release.outputs.zip_name }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ steps.release.outputs.asset_id }}"
          cd source
          unzip -q "${{ steps.release.outputs.zip_name }}"
          ZIP_BASENAME=$(basename "${{ steps.release.outputs.zip_name }}" .zip)
          if [ -d "$ZIP_BASENAME" ]; then
            cp -r "$ZIP_BASENAME/." .
          else
            EXTRACTED=$(find . -maxdepth 1 -mindepth 1 -type d | head -1)
            cp -r "$EXTRACTED/." .
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x source/gradlew

      - name: Build Release APK
        run: |
          cd source
          ./gradlew assembleRelease

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore rscoders.keystore \
            -alias rscoders \
            -keyalg RSA \
            -keysize 2048 \
            -validity 36500 \
            -dname "CN=RidwanzSaputra, OU=RSCoders, O=RSCoders, L=Kebumen, ST=Jawa Tengah, C=ID" \
            -storepass @Ridwanz45rs \
            -keypass @Ridwanz45rs

      - name: Sign APK
        id: sign
        run: |
          APK=$(find source/app/build/outputs/apk/release/ -name "*.apk" | head -1)
          ZIP_BASENAME=$(basename "${{ steps.release.outputs.zip_name }}" .zip)
          APK_NAME="${ZIP_BASENAME}_signed.apk"
          BUILD_TOOLS=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)
          mkdir -p hasil
          $BUILD_TOOLS/apksigner sign \
            --ks rscoders.keystore \
            --ks-key-alias rscoders \
            --ks-pass pass:@Ridwanz45rs \
            --key-pass pass:@Ridwanz45rs \
            --out "hasil/${APK_NAME}" \
            "$APK"
          APK_SIZE=$(du -sh "hasil/${APK_NAME}" | cut -f1)
          echo "apk_path=hasil/${APK_NAME}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "apk_size=${APK_SIZE}" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: Builded
          path: ${{ steps.sign.outputs.apk_path }}
          retention-days: 7
          