name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag source zip (kosongkan untuk ambil terbaru)'
        required: false
        default: ''

permissions:
  actions: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get Release Info
        id: release
        run: |
          INPUT_TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$INPUT_TAG" ]; then
            RELEASE_JSON=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest")
          else
            RELEASE_JSON=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/${INPUT_TAG}")
          fi
          TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
          ASSET_ID=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | endswith(".zip")) | .id' | head -1)
          ZIP_NAME=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | endswith(".zip")) | .name' | head -1)
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT
          echo "asset_id=$ASSET_ID" >> $GITHUB_OUTPUT
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT

      - name: Download Source ZIP from Release
        run: |
          mkdir -p source
          curl -L \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            -o "source/${{ steps.release.outputs.zip_name }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ steps.release.outputs.asset_id }}"
          cd source
          unzip -q "${{ steps.release.outputs.zip_name }}"
          ZIP_BASENAME=$(basename "${{ steps.release.outputs.zip_name }}" .zip)
          if [ -d "$ZIP_BASENAME" ]; then
            cp -r "$ZIP_BASENAME/." .
          else
            EXTRACTED=$(find . -maxdepth 1 -mindepth 1 -type d | head -1)
            cp -r "$EXTRACTED/." .
          fi

      - name: Set up JDK 17 (untuk sdkmanager)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK Build Tools
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes 2>/dev/null | sdkmanager --licenses || true
          sdkmanager "platforms;android-23" "build-tools;30.0.3"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/30.0.3" >> $GITHUB_ENV
          echo "ANDROID_JAR=$ANDROID_HOME/platforms/android-23/android.jar" >> $GITHUB_ENV

      - name: Patch AndroidManifest for API 21 compatibility
        run: |
          sed -i \
            -e 's/android:networkSecurityConfig="[^"]*"//g' \
            -e 's/android:usesCleartextTraffic="[^"]*"//g' \
            source/AndroidManifest.xml
          echo "Manifest after patch:"
          cat source/AndroidManifest.xml

      - name: Set up JDK 8 (untuk javac)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Generate R.java
        run: |
          mkdir -p source/gen source/bin/classes source/bin/apk
          $BUILD_TOOLS/aapt package -f -m \
            -J source/gen \
            -M source/AndroidManifest.xml \
            -S source/res \
            -I $ANDROID_JAR

      - name: Compile Java
        run: |
          JAVA_FILES=$(find source/src source/gen -type f -name "*.java")
          javac -source 1.8 -target 1.8 \
            -d source/bin/classes \
            -classpath source/src:source/gen \
            -bootclasspath $ANDROID_JAR \
            $JAVA_FILES

      - name: Convert to DEX
        run: |
          $BUILD_TOOLS/dx --dex \
            --output=source/bin/apk/classes.dex \
            source/bin/classes

      - name: Package Resources
        run: |
          if [ -d "source/assets" ]; then
            $BUILD_TOOLS/aapt package -f \
              -I $ANDROID_JAR \
              -S source/res \
              -M source/AndroidManifest.xml \
              -A source/assets \
              -F source/bin/apk/unaligned.apk
          else
            $BUILD_TOOLS/aapt package -f \
              -I $ANDROID_JAR \
              -S source/res \
              -M source/AndroidManifest.xml \
              -F source/bin/apk/unaligned.apk
          fi
          cd source/bin/apk
          $BUILD_TOOLS/aapt add -f unaligned.apk classes.dex

      - name: Zipalign
        run: |
          $BUILD_TOOLS/zipalign -f 4 \
            source/bin/apk/unaligned.apk \
            source/bin/apk/aligned.apk

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore rscoders.keystore \
            -alias rscoders \
            -keyalg RSA \
            -keysize 2048 \
            -validity 36500 \
            -dname "CN=RidwanzSaputra, OU=RSCoders, O=RSCoders, L=Kebumen, ST=Jawa Tengah, C=ID" \
            -storepass @Ridwanz45rs \
            -keypass @Ridwanz45rs

      - name: Sign APK
        id: sign
        run: |
          ZIP_BASENAME=$(basename "${{ steps.release.outputs.zip_name }}" .zip)
          APK_NAME="${ZIP_BASENAME}_signed.apk"
          mkdir -p hasil
          $BUILD_TOOLS/apksigner sign \
            --ks rscoders.keystore \
            --ks-key-alias rscoders \
            --ks-pass pass:@Ridwanz45rs \
            --key-pass pass:@Ridwanz45rs \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out "hasil/${APK_NAME}" \
            source/bin/apk/aligned.apk
          APK_SIZE=$(du -sh "hasil/${APK_NAME}" | cut -f1)
          echo "apk_path=hasil/${APK_NAME}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "apk_size=${APK_SIZE}" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Builded
          path: ${{ steps.sign.outputs.apk_path }}
          retention-days: 7