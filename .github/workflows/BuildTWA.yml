name: Build TWA APK

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'URL Website (https://...)'
        required: true
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'My App'
      package_name:
        description: 'Package Name (com.example.app)'
        required: true
        default: 'com.example.app'
      theme_color:
        description: 'Theme Color (hex, contoh: #000000)'
        required: false
        default: '#000000'
      background_color:
        description: 'Background Color (hex, contoh: #ffffff)'
        required: false
        default: '#ffffff'

permissions:
  actions: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Bubblewrap
        run: npm i -g @bubblewrap/cli

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore rscoders.keystore \
            -alias rscoders \
            -keyalg RSA \
            -keysize 2048 \
            -validity 36500 \
            -dname "CN=RidwanzSaputra, OU=RSCoders, O=RSCoders, L=Kebumen, ST=Jawa Tengah, C=ID" \
            -storepass @Ridwanz45rs \
            -keypass @Ridwanz45rs

      - name: Init TWA Project
        run: |
          mkdir -p twa-project
          cd twa-project
          yes n | bubblewrap init \
            --manifest "${{ github.event.inputs.website_url }}/manifest.json" \
            --directory . \
            --skipPwaValidation

      - name: Patch twa-manifest.json
        run: |
          cd twa-project
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('twa-manifest.json', 'utf8'));
            m.packageId = '${{ github.event.inputs.package_name }}';
            m.name = '${{ github.event.inputs.app_name }}';
            m.themeColor = '${{ github.event.inputs.theme_color }}';
            m.backgroundColor = '${{ github.event.inputs.background_color }}';
            m.signingKey = {
              path: '../rscoders.keystore',
              alias: 'rscoders'
            };
            m.keystorePassword = '@Ridwanz45rs';
            m.keyPassword = '@Ridwanz45rs';
            fs.writeFileSync('twa-manifest.json', JSON.stringify(m, null, 2));
            console.log('Manifest patched!');
          "

      - name: Build TWA APK
        run: |
          cd twa-project
          bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath ../rscoders.keystore \
            --signingKeyAlias rscoders

      - name: Generate assetlinks.json
        id: assetlinks
        run: |
          FINGERPRINT=$(keytool -list -v \
            -keystore rscoders.keystore \
            -alias rscoders \
            -storepass @Ridwanz45rs 2>/dev/null \
            | grep "SHA256:" | head -1 | awk '{print $2}')

          echo "sha256=${FINGERPRINT}" >> $GITHUB_OUTPUT

          cat > twa-project/assetlinks.json << EOF
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "${{ github.event.inputs.package_name }}",
              "sha256_cert_fingerprints": ["${FINGERPRINT}"]
            }
          }]
          EOF

      - name: Rename APK
        id: apk
        run: |
          APP_SLUG=$(echo "${{ github.event.inputs.app_name }}" | tr ' ' '_' | tr '[:upper:]' '[:lower:]')
          APK_NAME="${APP_SLUG}_twa_signed.apk"
          mkdir -p hasil
          cp twa-project/app-release-signed.apk "hasil/${APK_NAME}"
          APK_SIZE=$(du -sh "hasil/${APK_NAME}" | cut -f1)
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "apk_path=hasil/${APK_NAME}" >> $GITHUB_OUTPUT
          echo "apk_size=${APK_SIZE}" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 7

      - name: Upload assetlinks.json
        uses: actions/upload-artifact@v4
        with:
          name: assetlinks
          path: twa-project/assetlinks.json
          retention-days: 7

      - name: Summary
        run: |
          echo "### ✅ Build TWA Selesai" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Info | Detail |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| App | ${{ github.event.inputs.app_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Package | ${{ github.event.inputs.package_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | ${{ github.event.inputs.website_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| APK | ${{ steps.apk.outputs.apk_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Size | ${{ steps.apk.outputs.apk_size }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 SHA256 Fingerprint" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.assetlinks.outputs.sha256 }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📁 Langkah Selanjutnya" >> $GITHUB_STEP_SUMMARY
          echo "1. Download **APK** dari Artifacts → install di HP" >> $GITHUB_STEP_SUMMARY